name: theatre-watch

# 每天固定時間抓一次倫敦劇院便宜票。
# cron 是 UTC,英國夏令時間(BST)= UTC+1、冬令(GMT)= UTC+0,
# 所以下面兩個時間在夏天分別是 00:15 / 10:15,冬天會早一小時。
on:
  schedule:
    - cron: "15 23 * * *"   # Official London Theatre 每天 00:01 上架當日票
    - cron: "15  9 * * *"   # TodayTix Rush 每天 10:00 開賣
  workflow_dispatch:         # 也可以在 Actions 頁面手動按一下
    inputs:
      max_price:
        description: "預算上限(英鎊)"
        required: false
        default: "30"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/theatre-watch/requirements.txt

      - name: 安裝套件
        run: pip install -r tools/theatre-watch/requirements.txt

      # 把上一次的 latest.json 還原回來,才比得出「今天新出現 / 降價」
      - name: 還原上次的快照
        uses: actions/cache@v4
        with:
          path: tools/theatre-watch/data
          key: theatre-watch-data-${{ github.run_id }}
          restore-keys: theatre-watch-data-

      - name: 跑 parser 測試
        run: python3 tools/theatre-watch/tests/test_parse.py

      - name: 抓取
        id: scrape
        continue-on-error: true   # 抓不到不要讓整條 workflow 變紅,下面會標示出來
        run: |
          python3 tools/theatre-watch/watch.py \
            --max-price "${{ inputs.max_price || '30' }}"

      - name: 把報告貼到 job summary
        if: always()
        run: |
          if [ -f tools/theatre-watch/REPORT.md ]; then
            cat tools/theatre-watch/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ 這次沒有產出報告" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上傳快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theatre-watch-${{ github.run_number }}
          path: |
            tools/theatre-watch/data/
            tools/theatre-watch/REPORT.md
          retention-days: 30
          if-no-files-found: warn

      # 抓到 0 筆通常代表網站改版、parser 該修了 —— 讓 workflow 變紅,
      # GitHub 會寄失敗通知給你(Settings → Notifications → Actions)
      - name: 抓不到就報錯
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::一筆都沒抓到,parser 可能要修了。下載 artifact 或用 --dump-html 檢查。"
          exit 1
